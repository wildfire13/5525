name: Native gameplay and save validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - '!godot/**/*.md'
      - 'native/**'
      - '!native/**/*.md'
      - '.github/workflows/native-validation.yml'
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '!godot/**/*.md'
      - 'native/**'
      - '!native/**/*.md'
      - '.github/workflows/native-validation.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure isolated profile
        run: |
          for entry in DATA CONFIG CACHE; do
            destination="$RUNNER_TEMP/5525-native-profile/$entry"
            mkdir -p "$destination"
            echo "XDG_${entry}_HOME=$destination" >> "$GITHUB_ENV"
          done
      - name: Install image validation dependency
        run: python -m pip install Pillow==12.3.0
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Run full native non-GUI suite
        run: python native/check.py --evidence "$RUNNER_TEMP/5525-reports"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: supplemental-native-summary
          path: ${{ runner.temp }}/5525-reports/qa-check-report.json
          retention-days: 5
          if-no-files-found: error
