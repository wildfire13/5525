name: FHD gameplay and UI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - 'native/**'
      - '!godot/**/*.md'
      - '!native/**/*.md'
      - '.github/scripts/**'
      - '.github/workflows/mock-ui-regression.yml'
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'native/**'
      - '!godot/**/*.md'
      - '!native/**/*.md'
      - '.github/scripts/**'
      - '.github/workflows/mock-ui-regression.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked Godot script and shader UIDs
        run: python3 .github/scripts/check_godot_uids.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure isolated profile
        run: |
          for entry in DATA CONFIG CACHE; do
            destination="$RUNNER_TEMP/5525-mock-profile/$entry"
            mkdir -p "$destination"
            echo "XDG_${entry}_HOME=$destination" >> "$GITHUB_ENV"
          done
      - name: Install test runtimes
        run: |
          python -m pip install Pillow==12.3.0
          python .github/scripts/install_godot.py
      - name: Import Godot project
        run: |
          timeout 180 godot --headless --path godot --editor --import --quit > "$RUNNER_TEMP/godot-mock-import.log" 2>&1
          if rg 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/godot-mock-import.log"; then exit 1; fi
      - name: Verify facility and icon assets
        run: |
          python godot/tests/facility_asset_integrity.py
          python godot/tests/individual_icons_integrity.py
      - name: Verify FHD report failure handling
        run: python godot/tests/mock_ui_results_tests.py
      - name: Verify FHD UI and state transitions
        run: python godot/tests/run_mock_ui_regression.py --ci --evidence "$RUNNER_TEMP/5525-mock-regression"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: mock-ui-regression-summary
          path: ${{ runner.temp }}/5525-mock-regression/results.json
          retention-days: 5
          if-no-files-found: error
