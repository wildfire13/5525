name: Mock UI and journey regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - 'native/**'
      - '!godot/**/*.md'
      - '!native/**/*.md'
      - '.github/scripts/**'
      - '.github/workflows/mock-ui-regression.yml'
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'native/**'
      - '!godot/**/*.md'
      - '!native/**/*.md'
      - '.github/scripts/**'
      - '.github/workflows/mock-ui-regression.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tracked Godot script and shader UIDs
        run: python3 .github/scripts/check_godot_uids.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Configure isolated profile
        run: |
          for entry in DATA CONFIG CACHE; do
            destination="$RUNNER_TEMP/5525-mock-profile/$entry"
            mkdir -p "$destination"
            echo "XDG_${entry}_HOME=$destination" >> "$GITHUB_ENV"
          done
      - name: Install test runtimes
        run: |
          python -m pip install Pillow==12.3.0
          python .github/scripts/install_godot.py
      - name: Import Godot project
        run: |
          timeout 180 godot --headless --path godot --editor --import --quit > "$RUNNER_TEMP/godot-mock-import.log" 2>&1
          if rg 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/godot-mock-import.log"; then exit 1; fi
      - name: Verify reward and return journey rules
        run: node native/test_mock_ui_rules.cjs
      - name: Verify FHD UI and state transitions
        run: python godot/tests/run_mock_ui_regression.py --evidence "$RUNNER_TEMP/5525-mock-regression"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: mock-ui-regression-summary
          path: ${{ runner.temp }}/5525-mock-regression/results.json
          retention-days: 5
          if-no-files-found: ignore
