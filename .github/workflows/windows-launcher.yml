name: Windows launcher

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test runtimes
        run: |
          python -m pip install Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/install_godot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check real CMD and PowerShell launcher
        env:
          APPDATA: ${{ runner.temp }}\5525-profile\Roaming
          LOCALAPPDATA: ${{ runner.temp }}\5525-profile\Local
        run: |
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          $env:NATIVE5525_NODE = (Get-Command node).Source
          $env:NATIVE5525_PYTHON = (Get-Command python).Source
          python godot/tests/launcher_checks.py $env:GODOT_BIN
          exit $LASTEXITCODE
      - name: Retain synthetic test summary
        if: ${{ always() }}
        run: |
          if (Test-Path godot/qa/launcher-report.json) {
            $report = Get-Content godot/qa/launcher-report.json -Raw | ConvertFrom-Json
            $report.steps | Select-Object name, passed, exitCode, node_remaining | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/launcher-summary.json"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: windows-launcher-summary
          path: ${{ runner.temp }}/launcher-summary.json
          retention-days: 5
          if-no-files-found: ignore
