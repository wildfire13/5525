name: Godot gameplay regression and native validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - 'native/**'
      - '!godot/**/*.md'
      - '!native/**/*.md'
      - '.github/scripts/**'
      - '.github/workflows/legacy-ui-supplement.yml'
      - '.github/workflows/linux-regression.yml'
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'native/**'
      - '!godot/**/*.md'
      - '!native/**/*.md'
      - '.github/scripts/**'
      - '.github/workflows/legacy-ui-supplement.yml'
      - '.github/workflows/linux-regression.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-ui:
    name: Godot gameplay group ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Configure isolated profile
        run: |
          for entry in DATA CONFIG CACHE; do
            destination="$RUNNER_TEMP/5525-legacy-profile/$entry"
            mkdir -p "$destination"
            echo "XDG_${entry}_HOME=$destination" >> "$GITHUB_ENV"
          done
      - name: Install test runtimes
        run: |
          python -m pip install Pillow==12.3.0
          python .github/scripts/install_godot.py
      - name: Import Godot project
        run: |
          timeout 180 godot --headless --path godot --editor --import --quit > "$RUNNER_TEMP/godot-legacy-import.log" 2>&1
          if rg 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/godot-legacy-import.log"; then exit 1; fi
      - name: Verify exhaustive partition and fail-closed result checks
        if: matrix.shard == 0
        run: python -m unittest discover -s .github/scripts -p test_legacy_ui_shard.py
      - name: Run assigned legacy checks without changing their timeouts
        run: python .github/scripts/run_legacy_ui_shard.py --shard ${{ matrix.shard }} --evidence "$RUNNER_TEMP/5525-legacy-group"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: legacy-ui-group-${{ matrix.shard }}-summary
          path: |
            ${{ runner.temp }}/5525-legacy-group/manifest.json
            ${{ runner.temp }}/5525-legacy-group/results.json
          retention-days: 5
          if-no-files-found: error

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Configure isolated profile
        run: |
          for entry in DATA CONFIG CACHE; do
            destination="$RUNNER_TEMP/5525-native-profile/$entry"
            mkdir -p "$destination"
            echo "XDG_${entry}_HOME=$destination" >> "$GITHUB_ENV"
          done
      - name: Install image validation dependency
        run: python -m pip install Pillow==12.3.0
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Run full native non-GUI suite
        run: python native/check.py
      - name: Run supplemental Linux native checks
        if: ${{ !cancelled() }}
        run: |
          node native/test_updateplan_roster.cjs
          node native/test_inventory_capacity.cjs
          node native/test_equipment_permissions.cjs
          node native/test_warehouse.cjs
          node native/test_updateplan_skill_levels.cjs
          node native/test_updateplan_combat.cjs
          node native/test_updateplan_flow.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: supplemental-native-summary
          path: native/qa-check-report.json
          retention-days: 5
          if-no-files-found: error
